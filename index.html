<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RORA</title>


    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >


    <style>

        * {
            box-sizing:
                border-box;
        }


        html,
        body {

            margin:
                0;

            width:
                100%;

            height:
                100%;

            overflow:
                hidden;

            font-family:
                Arial,
                sans-serif;

        }


        #map {

            width:
                100%;

            height:
                100vh;

        }


        .panel {

            position:
                absolute;

            top:
                20px;

            left:
                20px;

            width:
                390px;

            max-height:
                calc(
                    100vh
                    -
                    40px
                );

            background:
                white;

            border-radius:
                18px;

            box-shadow:
                0 3px 14px
                rgba(
                    0,
                    0,
                    0,
                    0.22
                );

            overflow:
                hidden;

            z-index:
                1000;

            transition:
                transform
                0.35s
                ease;

        }


        .panel.desktop-collapsed {

            transform:
                translateX(
                    calc(
                        -100%
                        -
                        25px
                    )
                );

        }


        .panel-header {

            position:
                relative;

            height:
                54px;

            display:
                flex;

            align-items:
                center;

            padding:
                10px
                18px;

            background:
                white;

            user-select:
                none;

        }


        .panel-header h2 {

            margin:
                0;

            font-size:
                29px;

        }


        .panel-content {

            padding:
                0
                22px
                22px;

            max-height:
                calc(
                    100vh
                    -
                    94px
                );

            overflow-y:
                auto;

        }


        .desktop-toggle {

            position:
                fixed;

            top:
                37px;

            left:
                443px;

            width:
                36px;

            height:
                36px;

            border:
                none;

            border-radius:
                10px;

            background:
                white;

            box-shadow:
                0 2px 8px
                rgba(
                    0,
                    0,
                    0,
                    0.18
                );

            cursor:
                pointer;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            z-index:
                2000;

        }


        .desktop-toggle.closed {

            left:
                0;

            width:
                45px;

            height:
                45px;

            border-radius:
                0
                12px
                12px
                0;

        }


        .search-section {

            display:
                flex;

            gap:
                10px;

            margin-bottom:
                6px;

        }


        .route-dots {

            width:
                22px;

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            padding-top:
                25px;

        }


        .start-dot {

            width:
                13px;

            height:
                13px;

            border:
                3px solid
                #4285F4;

            border-radius:
                50%;

            background:
                white;

        }


        .route-line {

            width:
                2px;

            height:
                40px;

            background:
                #cccccc;

            margin:
                3px
                0;

        }


        .destination-dot {

            width:
                12px;

            height:
                12px;

            background:
                #d93025;

            border-radius:
                3px;

        }


        .search-boxes {

            flex:
                1;

        }


        .input-container {

            position:
                relative;

            margin-bottom:
                10px;

        }


        .search-input {

            width:
                100%;

            border:
                none;

            outline:
                none;

            background:
                #f1f3f4;

            border-radius:
                15px;

            padding:
                15px
                17px;

            font-size:
                16px;

        }


        .suggestions {

            position:
                absolute;

            top:
                calc(
                    100%
                    +
                    4px
                );

            left:
                0;

            width:
                100%;

            display:
                none;

            max-height:
                220px;

            overflow-y:
                auto;

            background:
                white;

            border:
                1px solid
                #dddddd;

            border-radius:
                10px;

            z-index:
                3000;

        }


        .suggestion {

            padding:
                10px;

            cursor:
                pointer;

            font-size:
                13px;

        }


        #locationButton {

            width:
                100%;

            border:
                none;

            background:
                white;

            color:
                #1a73e8;

            padding:
                8px
                10px;

            cursor:
                pointer;

            text-align:
                left;

        }


        .mode-buttons {

            display:
                flex;

            gap:
                10px;

            margin:
                12px
                0
                14px;

        }


        .mode-buttons button {

            border:
                none;

            background:
                #f1f3f4;

            border-radius:
                28px;

            padding:
                11px
                23px;

            cursor:
                pointer;

        }


        .mode-buttons button.active {

            background:
                #dce8ff;

            color:
                #174ea6;

            font-weight:
                700;

        }


        #routeButton {

            width:
                100%;

            border:
                none;

            border-radius:
                15px;

            padding:
                13px;

            background:
                #1a73e8;

            color:
                white;

            cursor:
                pointer;

            font-size:
                16px;

            font-weight:
                700;

            margin-bottom:
                12px;

        }


        #errorMessage {

            color:
                #c62828;

            margin-top:
                8px;

        }


        .route-choice {

            padding:
                14px;

            margin-top:
                12px;

            border:
                2px solid
                #dddddd;

            border-radius:
                14px;

            background:
                white;

            cursor:
                pointer;

        }


        .route-choice.selected {

            border-color:
                #1a73e8;

            background:
                #f5f9ff;

        }


        .route-choice.safe.selected {

            border-color:
                #0B1F3A;

        }


        .route-choice-title {

            font-size:
                17px;

            font-weight:
                700;

        }


        .route-choice-info {

            color:
                #555555;

            margin-top:
                5px;

        }


        .warning {

            color:
                #d32f2f;

            font-size:
                13px;

            font-weight:
                700;

            margin-top:
                8px;

        }


        .route-badge {

            display:
                inline-block;

            margin-top:
                8px;

            padding:
                5px
                8px;

            border-radius:
                9px;

            background:
                #e6f4ea;

            color:
                #137333;

            font-size:
                12px;

            font-weight:
                700;

        }


        .directions-container {

            margin-top:
                18px;

            padding-top:
                14px;

            border-top:
                1px solid
                #eeeeee;

        }


        .direction-step {

            display:
                flex;

            gap:
                11px;

            padding:
                11px
                0;

            border-bottom:
                1px solid
                #eeeeee;

        }


        .step-number {

            width:
                29px;

            height:
                29px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            border-radius:
                50%;

            background:
                #f1f3f4;

        }


        .step-text {

            flex:
                1;

        }


        .step-distance {

            display:
                block;

            color:
                #777777;

            font-size:
                12px;

            margin-top:
                3px;

        }


        #loadMoreFloodsButton {

            position:
                fixed;

            left:
                50%;

            bottom:
                28px;

            transform:
                translateX(
                    -50%
                );

            z-index:
                2500;

            border:
                none;

            background:
                white;

            color:
                #b71c1c;

            padding:
                12px
                20px;

            border-radius:
                24px;

            font-weight:
                700;

            cursor:
                pointer;

            box-shadow:
                0 3px 12px
                rgba(
                    0,
                    0,
                    0,
                    0.25
                );

            display:
                none;

        }


        .flood-marker {

            position:
                relative;

            width:
                70px;

            height:
                70px;

            overflow:
                visible;

        }


        .flood-dot {

            position:
                absolute;

            left:
                50%;

            top:
                50%;

            width:
                var(
                    --dot-size
                );

            height:
                var(
                    --dot-size
                );

            transform:
                translate(
                    -50%,
                    -50%
                );

            background:
                #ff0000;

            border:
                2px solid
                #8B0000;

            border-radius:
                50%;

            z-index:
                4;

        }


        .flood-square {

            position:
                absolute;

            left:
                50%;

            top:
                50%;

            width:
                var(
                    --square-size
                );

            height:
                var(
                    --square-size
                );

            transform:
                translate(
                    -50%,
                    -50%
                );

            border:
                2px solid
                rgba(
                    213,
                    0,
                    0,
                    0.75
                );

            background:
                rgba(
                    255,
                    51,
                    51,
                    0.13
                );

            display:
                none;

        }


        .flood-marker.show-square
        .flood-square {

            display:
                block;

        }


        .flood-ring {

            position:
                absolute;

            left:
                50%;

            top:
                50%;

            width:
                var(
                    --ripple-size
                );

            height:
                var(
                    --ripple-size
                );

            border:
                2px solid
                rgba(
                    255,
                    0,
                    0,
                    0.75
                );

            border-radius:
                50%;

            transform:
                translate(
                    -50%,
                    -50%
                );

            animation:
                floodRipple
                2.2s
                infinite
                ease-out;

        }


        .flood-ring.second {

            animation-delay:
                1.1s;

        }


        .flood-marker.no-ripple
        .flood-ring {

            display:
                none;

        }


        @keyframes floodRipple {

            0% {

                transform:
                    translate(
                        -50%,
                        -50%
                    )
                    scale(
                        0.6
                    );

                opacity:
                    0.8;

            }


            100% {

                transform:
                    translate(
                        -50%,
                        -50%
                    )
                    scale(
                        2.2
                    );

                opacity:
                    0;

            }

        }


        @media (
            max-width:
            600px
        ) {

            .desktop-toggle {

                display:
                    none;

            }


            .panel {

                top:
                    auto;

                bottom:
                    0;

                left:
                    0;

                width:
                    100%;

                height:
                    78vh;

                max-height:
                    78vh;

                border-radius:
                    22px
                    22px
                    0
                    0;

                transform:
                    translateY(
                        calc(
                            78vh
                            -
                            110px
                        )
                    );

            }


            .panel.mobile-expanded {

                transform:
                    translateY(
                        0
                    );

            }


            #loadMoreFloodsButton {

                bottom:
                    122px;

            }

        }

    </style>

</head>


<body>


<div
    id="mainPanel"
    class="panel"
>

    <div
        id="panelHeader"
        class="panel-header"
    >

        <h2>
            RORA
        </h2>

    </div>


    <div
        id="panelContent"
        class="panel-content"
    >

        <div
            class="search-section"
        >

            <div
                class="route-dots"
            >

                <div
                    class="start-dot"
                ></div>

                <div
                    class="route-line"
                ></div>

                <div
                    class="destination-dot"
                ></div>

            </div>


            <div
                class="search-boxes"
            >

                <div
                    class="input-container"
                >

                    <input
                        id="startInput"
                        class="search-input"
                        value="Beach 67th St, Queens, NY"
                        autocomplete="off"
                    >

                    <div
                        id="startSuggestions"
                        class="suggestions"
                    ></div>

                </div>


                <div
                    class="input-container"
                >

                    <input
                        id="destinationInput"
                        class="search-input"
                        value="Beach 44th St, Queens, NY"
                        autocomplete="off"
                    >

                    <div
                        id="destinationSuggestions"
                        class="suggestions"
                    ></div>

                </div>


                <button
                    id="locationButton"
                    onclick="useCurrentLocation()"
                >

                    ◎ Use my current location

                </button>

            </div>

        </div>


        <div
            class="mode-buttons"
        >

            <button
                id="driveButton"
                class="active"
                onclick="changeMode('driving')"
            >

                🚗 Drive

            </button>


            <button
                id="walkButton"
                onclick="changeMode('walking')"
            >

                🚶 Walk

            </button>

        </div>


        <button
            id="routeButton"
            onclick="loadRoutes()"
        >

            Directions

        </button>


        <div
            id="errorMessage"
        ></div>


        <div
            id="normalChoice"
            class="route-choice selected"
            onclick="selectRoute('normal')"
        >

            <div
                id="normalTitle"
                class="route-choice-title"
            >

                Recommended route

            </div>

            <div
                id="normalInfo"
                class="route-choice-info"
            >

                --

            </div>

            <div
                id="normalWarning"
                class="warning"
                style="display:none;"
            >

                ⚠ This route crosses a flood hazard

            </div>

        </div>


        <div
            id="safeChoice"
            class="route-choice safe"
            onclick="selectRoute('safe')"
            style="display:none;"
        >

            <div
                id="safeTitle"
                class="route-choice-title"
            >

                Recommended safer route

            </div>

            <div
                id="safeInfo"
                class="route-choice-info"
            >

                --

            </div>

            <div
                class="route-badge"
            >

                Avoids detected flood areas

            </div>

        </div>


        <div
            class="directions-container"
        >

            <h3>
                Directions
            </h3>

            <div
                id="directionsList"
            ></div>

        </div>

    </div>

</div>


<button
    id="desktopToggle"
    class="desktop-toggle"
>

    ◀

</button>


<div
    id="map"
></div>


<button
    id="loadMoreFloodsButton"
>

    Load more floods

</button>


<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>


<script>


    const map =
        L.map(
            "map",
            {
                zoomControl:
                    false,

                preferCanvas:
                    true
            }
        )
        .setView(
            [
                40.59408,
                -73.78921
            ],
            14
        );


    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            attribution:
                "&copy; OpenStreetMap contributors"
        }
    )
    .addTo(
        map
    );


    let startCoordinates =
        null;

    let destinationCoordinates =
        null;

    let normalRoute =
        null;

    let safeRoute =
        null;

    let currentLocationMarker =
        null;

    let destinationMarker =
        null;

    let normalRouteData =
        null;

    let safeRouteData =
        null;

    let routeIntersectsFlood =
        false;

    let currentMode =
        "driving";


    const FLOODS_PER_REQUEST =
        100;

    const VIEW_BUFFER =
        0.12;

    const SQUARE_MIN_ZOOM =
        15;

    const RIPPLE_MIN_ZOOM =
        12;


    const loadedHazards =
        new Map();


    const forcedRouteHazards =
        new Set();


    const hazardMarkers =
        new Map();


    let currentFloodOffset =
        0;

    let currentFloodViewKey =
        "";

    let floodRequestRunning =
        false;

    let floodMoveTimer =
        null;


    const loadMoreFloodsButton =
        document.getElementById(
            "loadMoreFloodsButton"
        );


    function setupAutocomplete(
        inputId,
        suggestionId,
        type
    ) {

        const input =
            document.getElementById(
                inputId
            );


        const suggestions =
            document.getElementById(
                suggestionId
            );


        let timer;


        input.addEventListener(
            "input",
            function () {

                clearTimeout(
                    timer
                );


                if (
                    type
                    ===
                    "start"
                ) {

                    startCoordinates =
                        null;

                }

                else {

                    destinationCoordinates =
                        null;

                }


                const text =
                    input
                    .value
                    .trim();


                if (
                    text.length
                    <
                    2
                ) {

                    suggestions.style.display =
                        "none";

                    return;

                }


                timer =
                    setTimeout(
                        function () {

                            fetch(
                                "/autocomplete?text="
                                +
                                encodeURIComponent(
                                    text
                                )
                            )

                            .then(
                                response =>
                                    response.json()
                            )

                            .then(
                                results => {

                                    suggestions.innerHTML =
                                        "";


                                    results.forEach(
                                        result => {

                                            const item =
                                                document.createElement(
                                                    "div"
                                                );


                                            item.className =
                                                "suggestion";


                                            item.innerText =
                                                result.label;


                                            item.onclick =
                                                function () {

                                                    input.value =
                                                        result.label;


                                                    const coordinates = {

                                                        latitude:
                                                            result.latitude,

                                                        longitude:
                                                            result.longitude

                                                    };


                                                    if (
                                                        type
                                                        ===
                                                        "start"
                                                    ) {

                                                        startCoordinates =
                                                            coordinates;

                                                    }

                                                    else {

                                                        destinationCoordinates =
                                                            coordinates;

                                                    }


                                                    suggestions.style.display =
                                                        "none";

                                                };


                                            suggestions.appendChild(
                                                item
                                            );

                                        }
                                    );


                                    suggestions.style.display =
                                        "block";

                                }
                            );

                        },

                        150
                    );

            }
        );

    }


    setupAutocomplete(
        "startInput",
        "startSuggestions",
        "start"
    );


    setupAutocomplete(
        "destinationInput",
        "destinationSuggestions",
        "destination"
    );


    function useCurrentLocation() {

        navigator.geolocation.getCurrentPosition(
            position => {

                startCoordinates = {

                    latitude:
                        position.coords.latitude,

                    longitude:
                        position.coords.longitude

                };


                document.getElementById(
                    "startInput"
                ).value =
                    "Current location";

            }
        );

    }


    function loadRoutes() {

        const startText =
            document.getElementById(
                "startInput"
            ).value;


        const destinationText =
            document.getElementById(
                "destinationInput"
            ).value;


        let url =
            "/routes?mode="
            +
            encodeURIComponent(
                currentMode
            )

            +

            "&start="
            +
            encodeURIComponent(
                startText
            )

            +

            "&destination="
            +
            encodeURIComponent(
                destinationText
            );


        if (
            startCoordinates
        ) {

            url +=
                "&start_lat="
                +
                startCoordinates.latitude

                +

                "&start_lon="
                +
                startCoordinates.longitude;

        }


        if (
            destinationCoordinates
        ) {

            url +=
                "&destination_lat="
                +
                destinationCoordinates.latitude

                +

                "&destination_lon="
                +
                destinationCoordinates.longitude;

        }


        fetch(
            url
        )

        .then(
            response =>
                response.json()
        )

        .then(
            data => {


                normalRouteData =
                    data.normal;


                safeRouteData =
                    data.safe;


                routeIntersectsFlood =
                    Boolean(
                        data.intersects_flood
                    );


                forcedRouteHazards.clear();


                if (
                    data.route_hazards
                ) {

                    data.route_hazards.forEach(
                        hazard => {

                            loadedHazards.set(
                                hazard.sensor_id,
                                hazard
                            );


                            forcedRouteHazards.add(
                                hazard.sensor_id
                            );

                        }
                    );

                }


                removeRoutes();


                drawEndpoints(
                    data
                );


                drawRoutes();


                updateCards();


                renderVisibleFloods();


                fitMap();

            }
        );

    }


    function removeRoutes() {

        [
            normalRoute,
            safeRoute,
            currentLocationMarker,
            destinationMarker
        ]
        .forEach(
            layer => {

                if (
                    layer
                    &&
                    map.hasLayer(
                        layer
                    )
                ) {

                    map.removeLayer(
                        layer
                    );

                }

            }
        );

    }


    function drawEndpoints(
        data
    ) {

        const start =
            data
            .start
            .coordinates;


        const destination =
            data
            .destination
            .coordinates;


        currentLocationMarker =
            L.circleMarker(
                [
                    start[1],
                    start[0]
                ],
                {
                    radius:
                        8,

                    color:
                        "white",

                    weight:
                        3,

                    fillColor:
                        "#4285F4",

                    fillOpacity:
                        1
                }
            )
            .addTo(
                map
            );


        destinationMarker =
            L.marker(
                [
                    destination[1],
                    destination[0]
                ]
            )
            .addTo(
                map
            );

    }


    function drawRoutes() {

        normalRoute =
            L.geoJSON(
                normalRouteData,
                {
                    style: {

                        color:
                            "#2787F5",

                        weight:
                            6,

                        opacity:
                            0.9,

                        dashArray:
                            routeIntersectsFlood
                            ?
                            "11 7"
                            :
                            null

                    }
                }
            )
            .addTo(
                map
            );


        if (
            routeIntersectsFlood
        ) {

            safeRoute =
                L.geoJSON(
                    safeRouteData,
                    {
                        style: {

                            color:
                                "#0B1F3A",

                            weight:
                                6,

                            opacity:
                                0.95

                        }
                    }
                )
                .addTo(
                    map
                );

        }

        else {

            safeRoute =
                null;

        }

    }


    function updateCards() {

        const normalSummary =
            normalRouteData
            .features[0]
            .properties
            .summary;


        document.getElementById(
            "normalInfo"
        ).innerText =

            formatDuration(
                normalSummary.duration
            )

            +

            " • "

            +

            formatDistance(
                normalSummary.distance
            );


        const safeChoice =
            document.getElementById(
                "safeChoice"
            );


        if (
            routeIntersectsFlood
        ) {

            const safeSummary =
                safeRouteData
                .features[0]
                .properties
                .summary;


            document.getElementById(
                "safeInfo"
            ).innerText =

                formatDuration(
                    safeSummary.duration
                )

                +

                " • "

                +

                formatDistance(
                    safeSummary.distance
                );


            safeChoice.style.display =
                "block";


            document.getElementById(
                "normalWarning"
            ).style.display =
                "block";

        }

        else {

            safeChoice.style.display =
                "none";


            document.getElementById(
                "normalWarning"
            ).style.display =
                "none";

        }

    }


    function selectRoute(
        routeName
    ) {

        if (
            routeName
            ===
            "safe"

            &&

            safeRoute
        ) {

            safeRoute.bringToFront();

            renderDirections(
                safeRouteData
            );

        }

        else {

            normalRoute.bringToFront();

            renderDirections(
                normalRouteData
            );

        }

    }


    function renderDirections(
        routeData
    ) {

        const list =
            document.getElementById(
                "directionsList"
            );


        list.innerHTML =
            "";


        const segments =
            routeData
            .features[0]
            .properties
            .segments
            ||
            [];


        let number =
            1;


        segments.forEach(
            segment => {

                (
                    segment.steps
                    ||
                    []
                )
                .forEach(
                    step => {

                        const row =
                            document.createElement(
                                "div"
                            );


                        row.className =
                            "direction-step";


                        row.innerHTML =

                            '<div class="step-number">'
                            +
                            number
                            +
                            '</div>'

                            +

                            '<div class="step-text">'
                            +
                            step.instruction
                            +
                            '<span class="step-distance">'
                            +
                            formatStepDistance(
                                step.distance
                            )
                            +
                            '</span>'
                            +
                            '</div>';


                        list.appendChild(
                            row
                        );


                        number +=
                            1;

                    }
                );

            }
        );

    }


    function formatDuration(
        seconds
    ) {

        return (
            Math.round(
                seconds
                /
                60
            )
            +
            " min"
        );

    }


    function formatDistance(
        meters
    ) {

        return (
            (
                meters
                /
                1609.34
            )
            .toFixed(
                1
            )
            +
            " mi"
        );

    }


    function formatStepDistance(
        meters
    ) {

        if (
            meters
            <
            160.934
        ) {

            return (
                Math.round(
                    meters
                    *
                    3.28084
                )
                +
                " ft"
            );

        }


        return (
            (
                meters
                /
                1609.34
            )
            .toFixed(
                1
            )
            +
            " mi"
        );

    }


    function clamp(
        value,
        minimum,
        maximum
    ) {

        return Math.max(
            minimum,
            Math.min(
                maximum,
                value
            )
        );

    }


    function getFloodSizes() {

        const zoom =
            map.getZoom();


        return {

            dot:
                clamp(
                    6
                    +
                    (
                        zoom
                        -
                        9
                    )
                    *
                    1.4,
                    6,
                    18
                ),

            ripple:
                clamp(
                    12
                    +
                    (
                        zoom
                        -
                        9
                    )
                    *
                    2,
                    12,
                    30
                ),

            square:
                clamp(
                    20
                    +
                    (
                        zoom
                        -
                        9
                    )
                    *
                    3,
                    20,
                    44
                )

        };

    }


    function createFloodIcon() {

        const sizes =
            getFloodSizes();


        let classes =
            "flood-marker";


        if (
            map.getZoom()
            >=
            SQUARE_MIN_ZOOM
        ) {

            classes +=
                " show-square";

        }


        if (
            map.getZoom()
            <
            RIPPLE_MIN_ZOOM
        ) {

            classes +=
                " no-ripple";

        }


        return L.divIcon({

            className:
                "",

            iconSize:
                [
                    70,
                    70
                ],

            iconAnchor:
                [
                    35,
                    35
                ],

            html:

                '<div class="'
                +
                classes
                +
                '" '

                +

                'style="'

                +

                '--dot-size:'
                +
                sizes.dot
                +
                'px;'

                +

                '--ripple-size:'
                +
                sizes.ripple
                +
                'px;'

                +

                '--square-size:'
                +
                sizes.square
                +
                'px;'

                +

                '">'

                +

                '<div class="flood-square"></div>'

                +

                '<div class="flood-ring"></div>'

                +

                '<div class="flood-ring second"></div>'

                +

                '<div class="flood-dot"></div>'

                +

                '</div>'

        });

    }


    function getBufferedFloodBounds() {

        return map
            .getBounds()
            .pad(
                VIEW_BUFFER
            );

    }


    function renderVisibleFloods() {

        const bounds =
            getBufferedFloodBounds();


        const visibleIds =
            new Set();


        loadedHazards.forEach(
            hazard => {

                if (
                    !hazard.flood_active
                ) {

                    return;

                }


                const forced =
                    forcedRouteHazards.has(
                        hazard.sensor_id
                    );


                const inside =
                    bounds.contains(
                        L.latLng(
                            hazard.latitude,
                            hazard.longitude
                        )
                    );


                if (
                    !inside
                    &&
                    !forced
                ) {

                    return;

                }


                visibleIds.add(
                    hazard.sensor_id
                );


                let marker =
                    hazardMarkers.get(
                        hazard.sensor_id
                    );


                if (
                    !marker
                ) {

                    marker =
                        L.marker(
                            [
                                hazard.latitude,
                                hazard.longitude
                            ],
                            {
                                icon:
                                    createFloodIcon()
                            }
                        );


                    marker.bindPopup(

                        "<strong>FloodNet Sensor</strong>"

                        +

                        "<br>"

                        +

                        hazard.sensor_name

                        +

                        "<br>"

                        +

                        Number(
                            hazard.depth_inches
                        )
                        .toFixed(
                            2
                        )

                        +

                        " inches"

                    );


                    hazardMarkers.set(
                        hazard.sensor_id,
                        marker
                    );

                }

                else {

                    marker.setLatLng(
                        [
                            hazard.latitude,
                            hazard.longitude
                        ]
                    );


                    marker.setIcon(
                        createFloodIcon()
                    );

                }


                if (
                    !map.hasLayer(
                        marker
                    )
                ) {

                    marker.addTo(
                        map
                    );

                }

            }
        );


        hazardMarkers.forEach(
            (
                marker,
                id
            ) => {

                if (
                    !visibleIds.has(
                        id
                    )
                    &&
                    map.hasLayer(
                        marker
                    )
                ) {

                    map.removeLayer(
                        marker
                    );

                }

            }
        );

    }


    function makeFloodViewKey() {

        const bounds =
            getBufferedFloodBounds();


        return [

            bounds
            .getSouth()
            .toFixed(
                3
            ),

            bounds
            .getWest()
            .toFixed(
                3
            ),

            bounds
            .getNorth()
            .toFixed(
                3
            ),

            bounds
            .getEast()
            .toFixed(
                3
            ),

            map.getZoom()

        ]
        .join(
            ":"
        );

    }


    async function loadFloodsForCurrentView(
        resetOffset = false
    ) {

        if (
            floodRequestRunning
        ) {

            return;

        }


        const bounds =
            getBufferedFloodBounds();


        const key =
            makeFloodViewKey();


        if (
            resetOffset
            ||
            key
            !==
            currentFloodViewKey
        ) {

            currentFloodViewKey =
                key;

            currentFloodOffset =
                0;

        }


        floodRequestRunning =
            true;


        loadMoreFloodsButton.style.display =
            "block";


        loadMoreFloodsButton.innerText =
            "Loading floods...";


        const url =

            "/hazards"

            +

            "?min_lat="
            +
            bounds.getSouth()

            +

            "&max_lat="
            +
            bounds.getNorth()

            +

            "&min_lon="
            +
            bounds.getWest()

            +

            "&max_lon="
            +
            bounds.getEast()

            +

            "&limit="
            +
            FLOODS_PER_REQUEST

            +

            "&offset="
            +
            currentFloodOffset;


        try {

            const response =
                await fetch(
                    url
                );


            const data =
                await response.json();


            data.hazards.forEach(
                hazard => {

                    loadedHazards.set(
                        hazard.sensor_id,
                        hazard
                    );

                }
            );


            currentFloodOffset =
                data.next_offset;


            renderVisibleFloods();


            if (
                data.has_more
            ) {

                loadMoreFloodsButton.style.display =
                    "block";


                loadMoreFloodsButton.innerText =
                    "Load more floods";

            }

            else {

                loadMoreFloodsButton.style.display =
                    "none";

            }

        }

        catch (
            error
        ) {

            console.error(
                error
            );


            loadMoreFloodsButton.style.display =
                "block";


            loadMoreFloodsButton.innerText =
                "Retry floods";

        }


        floodRequestRunning =
            false;

    }


    function floodMapChanged() {

        clearTimeout(
            floodMoveTimer
        );


        floodMoveTimer =
            setTimeout(
                function () {

                    renderVisibleFloods();


                    const key =
                        makeFloodViewKey();


                    if (
                        key
                        !==
                        currentFloodViewKey
                    ) {

                        currentFloodViewKey =
                            key;


                        currentFloodOffset =
                            0;


                        loadMoreFloodsButton.style.display =
                            "block";


                        loadMoreFloodsButton.innerText =
                            "Load more floods";

                    }

                },

                300
            );

    }


    loadMoreFloodsButton.addEventListener(
        "click",
        function () {

            loadFloodsForCurrentView(
                false
            );

        }
    );


    map.on(
        "moveend",
        floodMapChanged
    );


    map.on(
        "zoomend",
        floodMapChanged
    );


    function fitMap() {

        const layers = [
            normalRoute,
            safeRoute,
            currentLocationMarker,
            destinationMarker
        ]
        .filter(
            Boolean
        );


        if (
            layers.length
            ===
            0
        ) {

            return;

        }


        const bounds =
            L.featureGroup(
                layers
            )
            .getBounds();


        map.fitBounds(
            bounds,
            {
                padding:
                    [
                        60,
                        60
                    ],

                maxZoom:
                    15
            }
        );

    }


    function changeMode(
        mode
    ) {

        currentMode =
            mode;


        document.getElementById(
            "driveButton"
        )
        .classList
        .toggle(
            "active",
            mode
            ===
            "driving"
        );


        document.getElementById(
            "walkButton"
        )
        .classList
        .toggle(
            "active",
            mode
            ===
            "walking"
        );


        loadRoutes();

    }


    const panel =
        document.getElementById(
            "mainPanel"
        );


    const desktopToggle =
        document.getElementById(
            "desktopToggle"
        );


    desktopToggle.addEventListener(
        "click",
        function () {

            const closing =
                !panel
                .classList
                .contains(
                    "desktop-collapsed"
                );


            panel
            .classList
            .toggle(
                "desktop-collapsed"
            );


            desktopToggle
            .classList
            .toggle(
                "closed",
                closing
            );


            desktopToggle.innerText =
                closing
                ?
                "▶"
                :
                "◀";

        }
    );


    loadRoutes();


    map.whenReady(
        function () {

            loadFloodsForCurrentView(
                true
            );

        }
    );


</script>
